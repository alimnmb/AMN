name: Build AMN Pro APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-amn:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ZedSecure v3.1.6 Source
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/ZedSecure
          ref: v3.1.6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Setup NDK & Build VPN Cores
        run: |
          DEFAULT_NDK=$(ls -d$ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$DEFAULT_NDK" ]; then
            export ANDROID_NDK_HOME="$DEFAULT_NDK"
            echo "ANDROID_NDK_HOME=$DEFAULT_NDK" >> $GITHUB_ENV
          fi

          chmod +x ./tools/*.sh 2>/dev/null || true
          if [ -f "./tools/fetch-cores.sh" ]; then
            ./tools/fetch-cores.sh || true
          fi
          if [ -f "./tools/get-cores.sh" ]; then
            ./tools/get-cores.sh android || true
          fi
          if [ -f "./tools/build-zedcore.sh" ]; then
            ./tools/build-zedcore.sh || true
          fi

      - name: 5. Safe Rebrand to AMN (Without Breaking Themes or Classes)
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re

          my_repo = os.environ.get("MY_REPO", "alimnmb/AMN")

          # ۱. تغییر فقط متن داخل تگ‌های <string> در فایل‌های strings.xml (بدون خراب شدن Theme.ZedSecure)
          for root, _, files in os.walk("app/src/main/res"):
              for file in files:
                  if file == "strings.xml":
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text

                          # فقط متن بین > و < را تغییر بده، نه نام متغیرها و استایل‌ها
                          text = re.sub(
                              r'>([^<]*?)ZedSecure([^<]*?)<',
                              lambda m: f'>{m.group(1)}AMN{m.group(2)}<',
                              text
                          )
                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)

                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass

          # ۲. تغییر نام نمایشی و لینک تلگرام در فایل‌های Kotlin رابط کاربری
          for root, _, files in os.walk("app/src/main"):
              for file in files:
                  if file.endswith(".kt"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text

                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                          text = text.replace('"ZedSecure"', '"AMN"')
                          text = text.replace('"ZedSecure VPN"', '"AMN VPN"')
                          text = text.replace("CluvexStudio/ZedSecure", my_repo)
                          text = text.replace('https://www.gstatic.com/generate_204', 'http://cp.cloudflare.com')

                          if file.lower() == "color.kt":
                              text = re.sub(r'0xFF[0-9A-Fa-f]{6}', '0xFF00F5D4', text, count=2)

                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass

          print("Safe Rebranding completed successfully!")
          EOF

      - name: 6. Generate AMN Logo (Proper PNG & WEBP Formats)
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin webp
          cat << 'EOF' > amn_logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090D16"/>
                <stop offset="100%" stop-color="#131B2E"/>
              </linearGradient>
              <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F5D4"/>
                <stop offset="100%" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <path d="M256 76 L406 140 V256 C406 355 340 425 256 456 C172 425 106 355 106 256 V140 Z" fill="#131B2E" stroke="url(#sh)" stroke-width="24" stroke-linejoin="round"/>
            <text x="256" y="292" font-family="sans-serif" font-size="100" font-weight="900" fill="#FFFFFF" text-anchor="middle">AMN</text>
            <rect x="186" y="322" width="140" height="10" rx="5" fill="url(#sh)"/>
          </svg>
          EOF

          rsvg-convert -w 512 -h 512 amn_logo.svg -o amn_logo.png
          rm -rf app/src/main/res/mipmap-anydpi*

          # تبدیل استاندارد فایل‌های PNG و WEBP بدون خراب شدن هدر تصویر
          find app/src/main/res -name "ic_launcher*.png" | while read icon; do
            cp amn_logo.png "$icon"
          done
          find app/src/main/res -name "ic_launcher*.webp" | while read icon; do
            cwebp -q 95 amn_logo.png -o "$icon"
          done

      - name: 7. Build Release APKs with Retry
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && break || {
              echo "Retrying gradle build ($i)..."
              sleep 10
            }
          done

      - name: 8. Sign APKs with AMN Exclusive Keystore
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner

          keytool -genkeypair -v \
            -keystore amn-release.jks \
            -alias amn_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AMNSecure2026! \
            -keypass AMNSecure2026! \
            -dname "CN=AMN, OU=Security, O=AMN, L=Tehran, S=Tehran, C=IR"

          mkdir -p output_apks

          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            base_name=$(basename "$apk" | sed 's/ZedSecure/AMN/g' | sed 's/app-/AMN-/g')
            rm -f "aligned-$base_name"
            zipalign -f -p 4 "$apk" "aligned-$base_name"
            apksigner sign \
              --ks amn-release.jks \
              --ks-key-alias amn_key \
              --ks-pass pass:AMNSecure2026! \
              --key-pass pass:AMNSecure2026! \
              --out "output_apks/AMN-$base_name" \
              "aligned-$base_name"
          done

      - name: 9. Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AMN-v3.1.6-Final
          name: "AMN Security v3.1.6 (Fixed & Ready)"
          body: |
            ### نسخه نهایی و تست‌شده AMN
            - **پشتیبانی تلگرام:** [@A_Mourdini_N](https://t.me/A_Mourdini_N)
            - **نسخه پیشنهادی:** `arm64-v8a`
          files: output_apks/*.apk
