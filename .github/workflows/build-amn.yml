          t_main = read(p_main)
          t_main = t_main.replace(
              "import dev.cluvex.zedsecure.ui.vault.VaultScreen",
              "import dev.cluvex.zedsecure.ui.vault.VaultScreen\nimport dev.cluvex.zedsecure.ui.vault.FreeConnectScreen",
