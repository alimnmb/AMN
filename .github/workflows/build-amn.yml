          t_repo = read(p_repo)
          old_repo_init = '        val d = AppSettings(useZepTun = true, directDns = "localhost")'
          new_repo_init = "\n".join([
              '        val d = AppSettings(useZepTun = true, directDns = "localhost")',
              '        if (!prefs.getBoolean("amn_sub_defaults_v1", false)) {',
              '            prefs.edit()',
