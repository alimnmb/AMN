          t = t[:body_start] + new_rows + t[ver_end:]
          write(p, t)

          p_design = KT + "/settings/AppDesignPicker.kt"
          write(p_design, read(p_design).replace('Text("Z", color = Color.White, style = MaterialTheme.typography.titleLargeEmphasized)', 'Text("A", color = Color.White, style = MaterialTheme.typography.titleLargeEmphasized)', 1))

