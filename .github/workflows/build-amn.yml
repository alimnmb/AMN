          p_pickers = KT + "/settings/AppearancePickers.kt"
          write(p_pickers, read(p_pickers).replace(') { Text("Z", color = on, fontSize = 18.sp, fontWeight = FontWeight.Bold) }', ') { Text("A", color = on, fontSize = 18.sp, fontWeight = FontWeight.Bold) }', 1))

          a_path_512 = "M256,86 L432,426 L342,426 L306,350 L206,350 L170,426 L80,426 Z M228,284 L284,284 L256,218 Z"
          write("shared/src/commonMain/composeResources/drawable/ic_zed_glyph.xml", "\n".join([
