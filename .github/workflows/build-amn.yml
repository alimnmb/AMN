name: Build AMN Pro APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-amn:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ZedSecure v3.1.6 Source
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/ZedSecure
          ref: v3.1.6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Setup NDK & VPN Cores
        run: |
          DEFAULT_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$DEFAULT_NDK" ]; then
            echo "ANDROID_NDK_HOME=$DEFAULT_NDK" >> $GITHUB_ENV
          fi

          chmod +x ./tools/*.sh 2>/dev/null || true
          if [ -f "./tools/fetch-cores.sh" ]; then
            ./tools/fetch-cores.sh || true
          fi
          if [ -f "./tools/get-cores.sh" ]; then
            ./tools/get-cores.sh android || true
          fi

      - name: 5. Safe Rebranding to AMN (UI & Strings Only)
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re

          my_repo = os.environ.get("MY_REPO", "AMN-Security/AMN")

          # تغییر امن رشته‌های متنی (بدون تغییر کدهای حساس JNI و هسته پروکسی)
          target_dirs = ["app/src/main/res", "shared"]
          for base in target_dirs:
              if not os.path.exists(base):
                  continue
              for root, _, files in os.walk(base):
                  for file in files:
                      if file.endswith(".xml"):
                          path = os.path.join(root, file)
                          try:
                              with open(path, "r", encoding="utf-8") as f:
                                  text = f.read()
                              orig = text
                              # تغییر نام اپ و پشتیبانی در استرینگ‌ها
                              text = text.replace(">ZedSecure<", ">AMN<")
                              text = text.replace("ZedSecure", "AMN")
                              text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                              text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                              text = text.replace('https://www.gstatic.com/generate_204', 'http://cp.cloudflare.com')

                              if text != orig:
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(text)
                          except Exception:
                              pass

          # تغییر لینک پشتیبانی در کدهای کاتلین بدون شکستن نام کلاس‌ها
          for root, _, files in os.walk("app/src/main/java"):
              for file in files:
                  if file.endswith(".kt"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text
                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                          text = text.replace('"ZedSecure"', '"AMN"')
                          text = text.replace("CluvexStudio/ZedSecure", my_repo)
                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass

          print("Safe rebranding applied!")
          EOF

      - name: 6. Build APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 7. Sign APK with AMN Key
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner

          keytool -genkeypair -v \
            -keystore amn-release.jks \
            -alias amn_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AMNSecure2026! \
            -keypass AMNSecure2026! \
            -dname "CN=AMN, OU=Security, O=AMN, L=Tehran, S=Tehran, C=IR"

          mkdir -p output_apks

          for apk in $(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*"); do
            base_name=$(basename "$apk" | sed 's/ZedSecure/AMN/g' | sed 's/app-/AMN-/g')
            zipalign -v -p 4 "$apk" "aligned-$base_name" || cp "$apk" "aligned-$base_name"
            apksigner sign \
              --ks amn-release.jks \
              --ks-key-alias amn_key \
              --ks-pass pass:AMNSecure2026! \
              --key-pass pass:AMNSecure2026! \
              --out "output_apks/AMN-$base_name" \
              "aligned-$base_name"
          done

          # در صورتی که فایل خروجی unsigned بود
          if [ -z "$(ls -A output_apks)" ]; then
            for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
              base_name=$(basename "$apk" | sed 's/ZedSecure/AMN/g' | sed 's/app-/AMN-/g')
              zipalign -v -p 4 "$apk" "aligned-$base_name" || cp "$apk" "aligned-$base_name"
              apksigner sign \
                --ks amn-release.jks \
                --ks-key-alias amn_key \
                --ks-pass pass:AMNSecure2026! \
                --key-pass pass:AMNSecure2026! \
                --out "output_apks/AMN-$base_name" \
                "aligned-$base_name"
            done
          fi

      - name: 8. Publish AMN APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AMN-v3.1.6-Stable
          name: "AMN Security v3.1.6 Stable"
          body: |
            ### نسخه پایدار AMN (تست‌شده و بدون کرش)
            - **پشتیبانی:** [@A_Mourdini_N](https://t.me/A_Mourdini_N)
          files: output_apks/*.apk
