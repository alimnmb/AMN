      - name: 6. Generate AMN Logo with Exact Standard Dimensions
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-pil
          cat << 'EOF' > amn_logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090D16"/>
                <stop offset="100%" stop-color="#131B2E"/>
              </linearGradient>
              <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F5D4"/>
                <stop offset="100%" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <path d="M256 76 L406 140 V256 C406 355 340 425 256 456 C172 425 106 355 106 256 V140 Z" fill="#131B2E" stroke="url(#sh)" stroke-width="24" stroke-linejoin="round"/>
            <text x="256" y="292" font-family="sans-serif" font-size="100" font-weight="900" fill="#FFFFFF" text-anchor="middle">AMN</text>
            <rect x="186" y="322" width="140" height="10" rx="5" fill="url(#sh)"/>
          </svg>
          EOF

          rsvg-convert -w 512 -h 512 amn_logo.svg -o amn_logo.png
          rm -rf app/src/main/res/mipmap-anydpi*

          python3 - << 'EOF'
          import os
          from PIL import Image

          master = Image.open("amn_logo.png").convert("RGBA")
          for root, _, files in os.walk("app/src/main/res"):
              for file in files:
                  if file.startswith("ic_launcher") and file.endswith((".png", ".webp")):
                      path = os.path.join(root, file)
                      try:
                          with Image.open(path) as img:
                              size = img.size
                              fmt = img.format or ("WEBP" if file.endswith(".webp") else "PNG")
                          resized = master.resize(size, Image.Resampling.LANCZOS)
                          resized.save(path, format=fmt)
                      except Exception:
                          pass
          EOF

      - name: 7. Build Release APKs with Retry
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && break || {
              echo "Retrying gradle build ($i)..."
              sleep 10
            }
          done

      - name: 8. Sign APKs with Persistent AMN Keystore (Allows Updating Without Uninstalling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_REPO: ${{ github.repository }}
          APP_VER: ${{ inputs.app_version || '3.1.7' }}
        run: |
          if ! gh release download amn-keystore-vault -p "amn-release.jks" --repo "$MY_REPO" 2>/dev/null; then
            echo "Generating permanent AMN Keystore for the first time..."
            keytool -genkeypair -v \
              -keystore amn-release.jks \
              -alias amn_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass AMNSecure2026! \
              -keypass AMNSecure2026! \
              -dname "CN=AMN, OU=Security, O=AMN, L=Tehran, S=Tehran, C=IR"
            gh release create amn-keystore-vault amn-release.jks \
              --repo "$MY_REPO" \
              --title "AMN Permanent Keystore (Do Not Delete)" \
              --notes "Permanent signing key so future updates install over existing app without uninstalling." \
              --prerelease || true
          else
            echo "Reusing existing permanent AMN Keystore from amn-keystore-vault..."
          fi

          mkdir -p output_apks
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            base_name=$(basename "$apk" | sed 's/-unsigned//g' | sed 's/-release//g' | sed 's/ZedSecure/AMN/g' | sed 's/app-/AMN-v'"$APP_VER"'-/g')
            "$ZIPALIGN" -f -p 4 "$apk" "aligned-$base_name"
            "$APKSIGNER" sign \
              --ks amn-release.jks \
              --ks-key-alias amn_key \
              --ks-pass pass:AMNSecure2026! \
              --key-pass pass:AMNSecure2026! \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "output_apks/$base_name" \
              "aligned-$base_name"
          done

      - name: 9. Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AMN-v${{ inputs.app_version || '3.1.7' }}
          name: "AMN Security v${{ inputs.app_version || '3.1.7' }}"
          make_latest: true
          body: |
            ### What's new
            ${{ inputs.release_notes || '• افزودن بخش اتصال هوشمند رایگان (انتخاب خودکار بهترین سرور در پس‌زمینه)\n• افزودن فروشگاه اشتراک اختصاصی VIP (هر گیگ ۶,۰۰۰ تومان)\n• بروزرسانی راهنمای تعاملی برنامه' }}

            ---
            - **پشتیبانی تلگرام:** [@A_Mourdini_N](https://t.me/A_Mourdini_N)
            - **نسخه پیشنهادی برای اکثر گوشی‌ها:** `arm64-v8a`
          files: output_apks/*.apk
