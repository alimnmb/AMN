          # 11) Connect GitHub Auto-Update Checker & Main Screen Popup to AMN Releases
          p_upd = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/data/update/UpdateChecker.kt"
          t_upd = read(p_upd)
          old_apk_lookup = "\n".join([
              '        val apk = if (abis.isEmpty()) null else {',
              '            (abis.map { "ZedSecure-$version-$it.apk" } + "ZedSecure-$version-universal.apk")',
              '                .firstNotNullOfOrNull { assets[it] }',
