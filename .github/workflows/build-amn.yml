          # 7) SettingsScreen.kt (About section, Z->A, Defaults, Update Checker)
          p = KT + "/settings/SettingsScreen.kt"
          t = read(p)
          pat = re.compile(
              r'\n[ ]*SettingsGroup\(modifier = Modifier\.tourTargetInPage\(TourTargets\.SETTINGS_SUPPORT\)\) \{\n'
              r'[ ]*SettingsBannerRow\(\n.*?\) \{ onOpen\(SettingsPage\.Support\) \}\n'
              r'[ ]*\}\n', re.S)
          t, c = pat.subn('\n', t, count=1)
          if c != 1:
              fail("support banner block not found")

          start = t.index('stringResource(Res.string.settings_about),\n            modifier = Modifier.tourTargetInPage(TourTargets.SETTINGS_ABOUT),')
          gstart = t.index('{', start)
          body_start = t.index('val fromPlay', gstart)
