name: Build AMN Pro APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-amn:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ZedSecure v3.1.6 Source
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/ZedSecure
          ref: v3.1.6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Setup NDK & Build VPN Cores
        run: |
          DEFAULT_NDK=$(ls -d$ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$DEFAULT_NDK" ]; then
            export ANDROID_NDK_HOME="$DEFAULT_NDK"
            export NDK_HOME="$DEFAULT_NDK"
            echo "ANDROID_NDK_HOME=$DEFAULT_NDK" >> $GITHUB_ENV
          fi

          chmod +x ./tools/*.sh 2>/dev/null || true
          if [ -f "./tools/fetch-cores.sh" ]; then
            ./tools/fetch-cores.sh || true
          fi
          if [ -f "./tools/get-cores.sh" ]; then
            ./tools/get-cores.sh android || true
          fi
          if [ -f "./tools/build-zedcore.sh" ]; then
            ./tools/build-zedcore.sh || true
          fi

      - name: 5. Safe Rebrand to AMN (Package ID + UI Strings Only)
        env:
          MY_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re

          my_repo = os.environ.get("MY_REPO", "alimnmb/AMN")

          # ۱. تغییر شناسه نصب به com.amn.vpn (برای نصب در کنار ZedSecure بدون تداخل)
          for root, _, files in os.walk("app"):
              for file in files:
                  if file in ("build.gradle", "build.gradle.kts"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      content = re.sub(
                          r'applicationId\s*=\s*"com\.zedsecure\.vpn"',
                          'applicationId = "com.amn.vpn"',
                          content
                      )
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)

          # ۲. جداسازی Authorities در مانیفست بدون دست زدن به نام کلاس‌های اجرایی یا Theme
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m_text = f.read()
              m_text = m_text.replace('android:authorities="com.zedsecure.vpn', 'android:authorities="com.amn.vpn')
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m_text)

          # ۳. تغییر فقط متن داخل تگ‌ها در strings.xml (بدون خراب شدن استایل‌ها)
          for root, _, files in os.walk("app/src/main/res"):
              for file in files:
                  if file == "strings.xml":
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text
                          text = re.sub(
                              r'>([^<]*?)ZedSecure([^<]*?)<',
                              lambda m: f'>{m.group(1)}AMN{m.group(2)}<',
                              text
                          )
                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass

          # ۴. تغییر نام نمایشی و لینک تلگرام در فایل‌های Kotlin
          for root, _, files in os.walk("app/src/main"):
              for file in files:
                  if file.endswith(".kt"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text
                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                          text = text.replace('"ZedSecure"', '"AMN"')
                          text = text.replace('"ZedSecure VPN"', '"AMN VPN"')
                          text = text.replace("CluvexStudio/ZedSecure", my_repo)
                          text = text.replace('https://www.gstatic.com/generate_204', 'http://cp.cloudflare.com')
                          if file.lower() == "color.kt":
                              text = re.sub(r'0xFF[0-9A-Fa-f]{6}', '0xFF00F5D4', text, count=2)
                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass
          EOF

      - name: 5b. AMN UI Changes (Home title, Settings About, Support)
        run: |
          python3 - << 'PYEOF'
          import re, sys, glob

          def fail(msg):
              print("AMN PATCH FAILED: " + msg)
              sys.exit(1)

          def read(p):
              with open(p, "r", encoding="utf-8") as f:
                  return f.read()

          def write(p, t):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(t)

          KT = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui"

          # 1) Home title: app_name -> AMN (shared Compose resources used by the Home screen)
          n = 0
          for p in glob.glob("shared/src/commonMain/composeResources/values*/strings.xml"):
              t = read(p)
              new = re.sub(r'(<string name="app_name">)[^<]*(</string>)', r'\1AMN\2', t)
              if new != t:
                  write(p, new)
                  n += 1
          if n == 0:
              fail("app_name not found in shared strings.xml")

          # 2) Settings screen
          p = KT + "/settings/SettingsScreen.kt"
          t = read(p)

          # 2a) remove the "Support the project" banner group
          pat = re.compile(
              r'\n[ ]*SettingsGroup\(modifier = Modifier\.tourTargetInPage\(TourTargets\.SETTINGS_SUPPORT\)\) \{\n'
              r'[ ]*SettingsBannerRow\(\n.*?\) \{ onOpen\(SettingsPage\.Support\) \}\n'
              r'[ ]*\}\n', re.S)
          t, c = pat.subn('\n', t, count=1)
          if c != 1:
              fail("support banner block not found")

          # 2b) About group: keep only the version row, then add Created By + Support rows
          start = t.index('stringResource(Res.string.settings_about),\n            modifier = Modifier.tourTargetInPage(TourTargets.SETTINGS_ABOUT),')
          gstart = t.index('{', start)
          body_start = t.index('val fromPlay', gstart)
          ver_row = t.index('SettingsMenuRow(\n                stringResource(Res.string.settings_about),\n                AppInfo.versionName,', body_start)
          ver_end = t.index('{ onAbout() }', ver_row) + len('{ onAbout() }')
          new_rows = '''SettingsMenuRow(
                          stringResource(Res.string.settings_about),
                          AppInfo.versionName,
                          art = SettingsArts.About,
                      ) { onAbout() }
                      SettingsMenuRow(
                          "Created By Ali Mourdini",
                          art = SettingsArts.About,
                      ) { }
                      SettingsMenuRow(
                          "Support",
                          "@A_Mourdini_N",
                          art = SettingsArts.Support,
                      ) { platform.openUri("https://t.me/A_Mourdini_N") }'''
          t = t[:body_start] + new_rows + t[ver_end:]
          write(p, t)

          # 3) Drop the tour step that pointed at the removed banner
          p = KT + "/onboarding/TourSteps.kt"
          t = read(p)
          pat = re.compile(
              r'\n[ ]*TourStep\(\n[ ]*target = TourTargets\.SETTINGS_SUPPORT,\n.*?\n[ ]*\),\n', re.S)
          t, c = pat.subn('\n', t, count=1)
          if c != 1:
              fail("tour support step not found")
          write(p, t)
          print("AMN UI patch applied OK")
          PYEOF

      - name: 5c. Remove Vault tab and finish AMN branding
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          import sys

          def patch(path, old, new, label, count=1):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"AMN patch failed: missing {path}")
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"AMN patch failed: {label} (expected at least {count}, found {actual})")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          nav = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui/navigation/NavBar.kt"
          patch(nav, "TopDestination.entries.forEach { dest ->",
                "TopDestination.entries.filter { it != TopDestination.Vault }.forEach { dest ->",
                "hide Vault from navigation", count=4)

          main = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui/MainScaffold.kt"
          patch(main, "onImported = { current = TopDestination.Vault }",
                "onImported = { current = TopDestination.Servers }", "route imported configs to Servers")
          patch(main, "current = if (activeProfile?.isLocked == true) TopDestination.Vault\n                        else TopDestination.Servers",
                "current = TopDestination.Servers", "remove hidden Vault browse route")

          hero = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui/settings/SettingsHero.kt"
          old = "\n".join([
              "        Icon(",
              "            painterResource(Res.drawable.ic_zed_glyph),",
              "            contentDescription = null,",
              "            tint = cs.onPrimary,",
              "            modifier = Modifier.size(58.dp),",
              "        )",
          ])
          new = "\n".join([
              "        Text(",
              '            text = "AMN",',
              "            color = cs.onPrimary,",
              "            fontSize = MaterialTheme.typography.titleLarge.fontSize,",
              "            fontWeight = androidx.compose.ui.text.font.FontWeight.Black,",
              "            maxLines = 1,",
              "        )",
          ])
          patch(hero, old, new, "replace Settings Z mark with AMN")

          icon = Path("app/src/main/res/drawable/ic_tile_zed.xml")
          if not icon.exists():
              raise SystemExit("AMN patch failed: notification icon file missing")
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                android:pathData="M12,2.5 L22,21.5 L17.2,21.5 L15.2,17.5 L8.8,17.5 L6.8,21.5 L2,21.5 Z M10.2,13.8 L13.8,13.8 L12,10.2 Z" />
          </vector>
          """, encoding="utf-8")

          for base in (Path("shared/src/commonMain/composeResources"), Path("app/src/main/res")):
              for p in base.glob("values*/strings.xml"):
                  text = p.read_text(encoding="utf-8")
                  import re
                  updated = re.sub(r'>([^<]*?)ZedSecure([^<]*?)<', lambda m: '>' + m.group(1) + 'AMN' + m.group(2) + '<', text, flags=re.IGNORECASE)
                  if updated != text:
                      p.write_text(updated, encoding="utf-8")
          print("AMN branding and Vault navigation patch applied")
          PYEOF

      - name: 6. Generate AMN Logo with Exact Standard Dimensions
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-pil
          cat << 'EOF' > amn_logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090D16"/>
                <stop offset="100%" stop-color="#131B2E"/>
              </linearGradient>
              <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F5D4"/>
                <stop offset="100%" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <path d="M256 76 L406 140 V256 C406 355 340 425 256 456 C172 425 106 355 106 256 V140 Z" fill="#131B2E" stroke="url(#sh)" stroke-width="24" stroke-linejoin="round"/>
            <text x="256" y="292" font-family="sans-serif" font-size="100" font-weight="900" fill="#FFFFFF" text-anchor="middle">AMN</text>
            <rect x="186" y="322" width="140" height="10" rx="5" fill="url(#sh)"/>
          </svg>
          EOF

          rsvg-convert -w 512 -h 512 amn_logo.svg -o amn_logo.png
          rm -rf app/src/main/res/mipmap-anydpi*

          python3 - << 'EOF'
          import os
          from PIL import Image

          master = Image.open("amn_logo.png").convert("RGBA")
          for root, _, files in os.walk("app/src/main/res"):
              for file in files:
                  if file.startswith("ic_launcher") and file.endswith((".png", ".webp")):
                      path = os.path.join(root, file)
                      try:
                          with Image.open(path) as img:
                              size = img.size
                              fmt = img.format or ("WEBP" if file.endswith(".webp") else "PNG")
                          resized = master.resize(size, Image.Resampling.LANCZOS)
                          resized.save(path, format=fmt)
                      except Exception:
                          pass
          EOF

      - name: 7. Build Release APKs with Retry
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && break || {
              echo "Retrying gradle build ($i)..."
              sleep 10
            }
          done

      - name: 8. Sign APKs with Official Android SDK Build-Tools
        run: |
          keytool -genkeypair -v \
            -keystore amn-release.jks \
            -alias amn_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AMNSecure2026! \
            -keypass AMNSecure2026! \
            -dname "CN=AMN, OU=Security, O=AMN, L=Tehran, S=Tehran, C=IR"

          mkdir -p output_apks
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            base_name=$(basename "$apk" | sed 's/-unsigned//g' | sed 's/ZedSecure/AMN/g' | sed 's/app-/AMN-/g')
            "$ZIPALIGN" -f -p 4 "$apk" "aligned-$base_name"
            "$APKSIGNER" sign \
              --ks amn-release.jks \
              --ks-key-alias amn_key \
              --ks-pass pass:AMNSecure2026! \
              --key-pass pass:AMNSecure2026! \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "output_apks/AMN-$base_name" \
              "aligned-$base_name"
          done

      - name: 9. Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AMN-v3.1.6-Working
          name: "AMN Security v3.1.6 (Ready)"
          body: |
            ### نسخه نهایی AMN (قابل نصب در کنار ZedSecure و بدون کرش)
            - **پشتیبانی تلگرام:** [@A_Mourdini_N](https://t.me/A_Mourdini_N)
            - **نسخه پیشنهادی:** `arm64-v8a`
          files: output_apks/*.apk
