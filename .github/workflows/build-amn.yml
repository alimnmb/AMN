name: Build AMN Pro APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App Version (e.g., 3.1.8 for updates)'
        required: false
        default: '3.1.8'
      release_notes:
        description: 'Release Notes (shown in the in-app update dialog)'
        required: false
        default: '• افزودن ردیف کانفیگ رایگان هوشمند زیر دکمه اتصال در صفحه اصلی (سازگار با تمام طراحی‌ها و رنگ‌ها)\n• تست خودکار در پس‌زمینه همراه با چرخش دکمه اتصال تا یافتن سریع‌ترین سرور\n• فروشگاه اختصاصی VIP در نوار پایین (هر گیگ ۶,۰۰۰ تومان)'

permissions:
  contents: write

jobs:
  build-amn:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ZedSecure v3.1.6 Source
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/ZedSecure
          ref: v3.1.6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Setup NDK & Build VPN Cores
        run: |
          DEFAULT_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$DEFAULT_NDK" ]; then
            export ANDROID_NDK_HOME="$DEFAULT_NDK"
            export NDK_HOME="$DEFAULT_NDK"
            echo "ANDROID_NDK_HOME=$DEFAULT_NDK" >> $GITHUB_ENV
          fi

          chmod +x ./tools/*.sh 2>/dev/null || true
          if [ -f "./tools/fetch-cores.sh" ]; then
            ./tools/fetch-cores.sh || true
          fi
          if [ -f "./tools/get-cores.sh" ]; then
            ./tools/get-cores.sh android || true
          fi
          if [ -f "./tools/build-zedcore.sh" ]; then
            ./tools/build-zedcore.sh || true
          fi

      - name: 5. Safe Rebrand to AMN & Dynamic Version Setup
        env:
          MY_REPO: ${{ github.repository }}
          APP_VER: ${{ inputs.app_version || '3.1.8' }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re

          my_repo = os.environ.get("MY_REPO", "alimourdini1/AMN")
          app_ver = os.environ.get("APP_VER", "3.1.8").strip() or "3.1.8"
          run_num = int(os.environ.get("RUN_NUM", "1"))
          ver_code = 35 + run_num

          # 0. Auto-increment versionCode & set versionName so updates install without uninstalling
          grad_props = "gradle.properties"
          if os.path.exists(grad_props):
              with open(grad_props, "r", encoding="utf-8") as f:
                  gp = f.read()
              gp = re.sub(r'zedsecure\.versionName=.*', f'zedsecure.versionName={app_ver}', gp)
              gp = re.sub(r'zedsecure\.versionCode=.*', f'zedsecure.versionCode={ver_code}', gp)
              with open(grad_props, "w", encoding="utf-8") as f:
                  f.write(gp)

          # 1. Change applicationId to com.amn.vpn
          for root, _, files in os.walk("app"):
              for file in files:
                  if file in ("build.gradle", "build.gradle.kts"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      content = re.sub(
                          r'applicationId\s*=\s*"com\.zedsecure\.vpn"',
                          'applicationId = "com.amn.vpn"',
                          content
                      )
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)

          # 2. Update provider authorities in AndroidManifest.xml
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m_text = f.read()
              m_text = m_text.replace('android:authorities="com.zedsecure.vpn', 'android:authorities="com.amn.vpn')
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m_text)

          # 3. Update strings.xml in app/src/main/res
          for root, _, files in os.walk("app/src/main/res"):
              for file in files:
                  if file == "strings.xml":
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              text = f.read()
                          orig = text
                          text = re.sub(
                              r'>([^<]*?)ZedSecure([^<]*?)<',
                              lambda m: f'>{m.group(1)}AMN{m.group(2)}<',
                              text
                          )
                          text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                          text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                          if text != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(text)
                      except Exception:
                          pass

          # 4. Update display names, User-Agent, and GitHub repo across both app and shared Kotlin files
          for base_dir in ("app/src/main", "shared/src"):
              for root, _, files in os.walk(base_dir):
                  for file in files:
                      if file.endswith(".kt"):
                          path = os.path.join(root, file)
                          try:
                              with open(path, "r", encoding="utf-8") as f:
                                  text = f.read()
                              orig = text
                              text = re.sub(r'https?://t\.me/[a-zA-Z0-9_]+', 'https://t.me/A_Mourdini_N', text)
                              text = re.sub(r'@CluvexStudio', '@A_Mourdini_N', text, flags=re.IGNORECASE)
                              text = text.replace('"ZedSecure"', '"AMN"')
                              text = text.replace('"ZedSecure VPN"', '"AMN VPN"')
                              text = text.replace('"ZedSecure/', '"AMN/')
                              text = text.replace('"ZedSecure-SpeedTest"', '"AMN-SpeedTest"')
                              text = text.replace("CluvexStudio/ZedSecure", my_repo)
                              if text != orig:
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(text)
                          except Exception:
                              pass
          EOF

      - name: 5b. AMN UI Changes, Home Free Config Row, Spinning Connect & VIP Store
        run: |
          python3 - << 'PYEOF'
          import re, sys, glob
          from pathlib import Path

          def fail(msg):
              print("AMN PATCH FAILED: " + msg)
              sys.exit(1)

          def read(p):
              with open(p, "r", encoding="utf-8") as f:
                  return f.read()

          def write(p, t):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(t)

          KT = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui"

          # 1) Update strings.xml (App name, Nav label for VIP Store, and Tour texts)
          for p in glob.glob("shared/src/commonMain/composeResources/values*/strings.xml"):
              t = read(p)
              is_fa = "values-fa" in p
              t = re.sub(r'(<string name="app_name">)[^<]*(</string>)', r'\1AMN\2', t)
              t = re.sub(
                  r'(<string name="nav_locked">)[^<]*(</string>)',
                  r'\1فروشگاه\2' if is_fa else r'\1VIP Store\2',
                  t
              )
              t = re.sub(
                  r'>([^<]*?)ZedSecure([^<]*?)<',
                  lambda m: '>' + m.group(1) + 'AMN' + m.group(2) + '<',
                  t,
                  flags=re.IGNORECASE
              )
              write(p, t)

          # 2) Add Free Config selection & background scanner to ConfigRepository.kt
          p_cr = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/data/config/ConfigRepository.kt"
          t_cr = read(p_cr)
          cr_anchor = "    fun setActive(id: String?) {"
          cr_inject = "\n".join([
              '    fun selectFreeModePlaceholder() {',
              '        val existing = _profiles.value.firstOrNull { it.id == "amn_free_smart" }',
              '        val placeholder = existing ?: VpnProfile(',
              '            id = "amn_free_smart",',
              '            name = "⚡ کانفیگ رایگان هوشمند",',
              '            protocol = "AUTO",',
              '            address = "auto",',
              '            port = 443,',
              '            transportLabel = "AMN Smart Free",',
              '            source = ProfileSource.Link("vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?security=none&type=tcp#AMN-Free"),',
              '            addedAt = currentTimeMillis(),',
              '            isLocked = true,',
              '        )',
              '        if (existing == null) {',
              '            _profiles.value = _profiles.value + placeholder',
              '            persistProfiles()',
              '        }',
              '        setActive("amn_free_smart")',
              '    }',
              '',
              '    suspend fun scanAndSelectBestFreeProfile(): VpnProfile = withContext(Dispatchers.IO) {',
              '        val urls = listOf(',
              '            "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",',
              '            "https://cdn.jsdelivr.net/gh/patterniha/Free-Configs@main/configs.txt",',
              '            "https://ghproxy.net/https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",',
              '        )',
              '        var rawBody: String? = null',
              '        for (u in urls) {',
              '            val r = runCatching { httpGetResponse(u, userAgent = "AMN/3.1.8").body }.getOrNull()',
              '            if (!r.isNullOrBlank()) {',
              '                rawBody = r',
              '                break',
              '            }',
              '        }',
              '        val text = rawBody ?: error("خطا در دریافت سرورهای رایگان؛ اتصال اینترنت را بررسی کنید")',
              '        val decoded = runCatching { ConfigParser.decodeBase64Utf8(text.trim()) }.getOrNull()?.takeIf { it.isNotBlank() } ?: text',
              '        val links = SubscriptionParser.extractLinks(decoded).ifEmpty { SubscriptionParser.extractLinks(text) }',
              '        if (links.isEmpty()) error("سرور رایگانی یافت نشد")',
              '',
              '        val candidates = links.shuffled().take(55).mapNotNull { lnk ->',
              '            runCatching {',
              '                VpnProfile.fromLink(link = lnk, id = "tmp", addedAt = 0L, locked = true)',
              '            }.getOrNull()',
              '        }',
              '        if (candidates.isEmpty()) error("کانفیگ معتبری یافت نشد")',
              '',
              '        val tcpSem = kotlinx.coroutines.sync.Semaphore(20)',
              '        val tcpPassed = kotlinx.coroutines.coroutineScope {',
              '            candidates.map { prof ->',
              '                kotlinx.coroutines.async {',
              '                    val ms = tcpSem.acquire().let {',
              '                        try {',
              '                            if (prof.address.isNotBlank() && prof.port in 1..65535) {',
              '                                dev.cluvex.zedsecure.platform.tcpConnectMillis(prof.address, prof.port, 1400)',
              '                            } else -1L',
              '                        } finally {',
              '                            tcpSem.release()',
              '                        }',
              '                    }',
              '                    if (ms > 0) prof to ms.toInt() else null',
              '                }',
              '            }.mapNotNull { it.await() }.sortedBy { it.second }',
              '        }',
              '        val finalists = tcpPassed.take(10)',
              '        if (finalists.isEmpty()) error("سرورهای رایگان پاسخ ندادند؛ دوباره تلاش کنید")',
              '',
              '        val realSem = kotlinx.coroutines.sync.Semaphore(5)',
              '        val realPassed = kotlinx.coroutines.coroutineScope {',
              '            finalists.map { (prof, _) ->',
              '                kotlinx.coroutines.async {',
              '                    val realMs = realSem.acquire().let {',
              '                        try {',
              '                            runCatching { dev.cluvex.zedsecure.data.net.PingService.realDelay(prof) }.getOrDefault(-1L)',
              '                        } finally {',
              '                            realSem.release()',
              '                        }',
              '                    }',
              '                    if (realMs > 0) prof to realMs.toInt() else null',
              '                }',
              '            }.mapNotNull { it.await() }.sortedBy { it.second }',
              '        }',
              '        val (winner, bestMs) = realPassed.firstOrNull() ?: finalists.first()',
              '        val finalProfile = winner.copy(',
              '            id = "amn_free_smart",',
              '            name = "⚡ کانفیگ رایگان هوشمند (${bestMs}ms)",',
              '            isLocked = true,',
              '            addedAt = currentTimeMillis(),',
              '            lastPingMs = bestMs,',
              '            note = null,',
              '        )',
              '        _profiles.value = _profiles.value.filterNot { it.id == "amn_free_smart" } + finalProfile',
              '        persistProfiles()',
              '        setActive("amn_free_smart")',
              '        finalProfile',
              '    }',
              '',
              '    fun setActive(id: String?) {',
          ])
          if cr_anchor not in t_cr:
              fail("setActive not found in ConfigRepository.kt")
          write(p_cr, t_cr.replace(cr_anchor, cr_inject, 1))

          # 3) Update TopDestination.kt so bottom nav has ONLY 4 tabs: Home, Servers, Vault (VIP Store), Settings
          p_top = KT + "/navigation/TopDestination.kt"
          write(p_top, "\n".join([
              'package dev.cluvex.zedsecure.ui.navigation',
              '',
              'import dev.cluvex.zedsecure.shared.resources.Res',
              'import dev.cluvex.zedsecure.shared.resources.ic_dns',
              'import dev.cluvex.zedsecure.shared.resources.ic_home',
              'import dev.cluvex.zedsecure.shared.resources.ic_settings',
              'import dev.cluvex.zedsecure.shared.resources.ic_star',
              'import dev.cluvex.zedsecure.shared.resources.nav_home',
              'import dev.cluvex.zedsecure.shared.resources.nav_locked',
              'import dev.cluvex.zedsecure.shared.resources.nav_servers',
              'import dev.cluvex.zedsecure.shared.resources.nav_settings',
              'import org.jetbrains.compose.resources.DrawableResource',
              'import org.jetbrains.compose.resources.StringResource',
              '',
              'enum class TopDestination(',
              '    val labelRes: StringResource,',
              '    val icon: DrawableResource,',
              ') {',
              '    Home(Res.string.nav_home, Res.drawable.ic_home),',
              '    Servers(Res.string.nav_servers, Res.drawable.ic_dns),',
              '    Vault(Res.string.nav_locked, Res.drawable.ic_star),',
              '    Settings(Res.string.nav_settings, Res.drawable.ic_settings),',
              '}',
          ]))

          # 4) Update MainActivity.kt so pressing Connect when Free Config is active spins the button while scanning in background!
          p_ma = "app/src/main/java/dev/cluvex/zedsecure/MainActivity.kt"
          t_ma = read(p_ma)
          old_toggle = "\n".join([
              '        if (planning) return',
              '        val profile = configRepository.activeProfile()',
              '        if (profile == null) {',
              '            toast(getString(R.string.select_config_first))',
              '            return',
              '        }',
              '        planning = true',
              '        lifecycleScope.launch {',
              '            val plan = try {',
              '                withContext(Dispatchers.IO) { planner.plan(profile) }',
              '            } finally {',
              '                planning = false',
              '            }',
          ])
          new_toggle = "\n".join([
              '        if (planning) return',
              '        val initialProfile = configRepository.activeProfile()',
              '        if (initialProfile == null) {',
              '            toast(getString(R.string.select_config_first))',
              '            return',
              '        }',
              '        planning = true',
              '        lifecycleScope.launch {',
              '            val profile = if (initialProfile.id == "amn_free_smart") {',
              '                VpnManager.onStarting("⚡ در حال یافتن بهترین سرور رایگان...")',
              '                val found = runCatching { configRepository.scanAndSelectBestFreeProfile() }',
              '                found.getOrElse { e ->',
              '                    planning = false',
              '                    VpnManager.onDisconnected()',
              '                    toast(e.message ?: "خطا در یافتن سرور رایگان")',
              '                    return@launch',
              '                }',
              '            } else {',
              '                initialProfile',
              '            }',
              '            val plan = try {',
              '                withContext(Dispatchers.IO) { planner.plan(profile) }',
              '            } finally {',
              '                planning = false',
              '            }',
          ])
          if old_toggle not in t_ma:
              fail("toggleConnection block not found in MainActivity.kt")
          write(p_ma, t_ma.replace(old_toggle, new_toggle, 1))

          # 5) Add FreeConfigRow composable to HomeScreen.kt, PixelHome.kt, and PortalHome.kt (adaptive to all 3 designs & colors!)
          # 5a) PixelHome.kt: add PixelFreeRow right above PixelServerRow
          p_px = KT + "/home/PixelHome.kt"
          t_px = read(p_px)
          old_px_sig = "    onBrowseConfigs: () -> Unit,"
          new_px_sig = "    onBrowseConfigs: () -> Unit,\n    freeActive: Boolean = false,\n    onSelectFree: () -> Unit = {},"
          if old_px_sig not in t_px:
              fail("onBrowseConfigs sig not found in PixelHome.kt")
          t_px = t_px.replace(old_px_sig, new_px_sig, 1)

          old_px_row = "\n".join([
              "                    PixelServerRow(",
              "                        name = activeConfigName,",
              "                        detail = activeConfigDetail,",
              "                        locked = activeLocked,",
              "                        onClick = onBrowseConfigs,",
              "                        modifier = Modifier.tourTarget(TourTargets.CONFIG_CARD),",
              "                    )",
          ])
          new_px_row = "\n".join([
              "                    PixelFreeRow(",
              "                        selected = freeActive,",
              "                        detail = if (freeActive) activeConfigName else null,",
              "                        onClick = onSelectFree,",
              "                        modifier = Modifier.tourTarget(\"free-row\"),",
              "                    )",
              "                    PixelServerRow(",
              "                        name = if (freeActive) null else activeConfigName,",
              "                        detail = if (freeActive) null else activeConfigDetail,",
              "                        locked = false,",
              "                        onClick = onBrowseConfigs,",
              "                        modifier = Modifier.tourTarget(TourTargets.CONFIG_CARD),",
              "                    )",
          ])
          if old_px_row not in t_px:
              fail("PixelServerRow call not found in PixelHome.kt")
          t_px = t_px.replace(old_px_row, new_px_row, 1)

          px_composable = "\n".join([
              "",
              "@Composable",
              "private fun PixelFreeRow(",
              "    selected: Boolean,",
              "    detail: String?,",
              "    onClick: () -> Unit,",
              "    modifier: Modifier = Modifier,",
              ") {",
              "    val cs = MaterialTheme.colorScheme",
              "    val source = remember { MutableInteractionSource() }",
              "    val pressed by source.collectIsPressedAsState()",
              "    val turn by animateFloatAsState(if (pressed || selected) 45f else 0f, MaterialTheme.motionScheme.fastSpatialSpec(), label = \"pixel-free-turn\")",
              "    val container by animateColorAsState(if (selected) cs.primaryContainer else cs.surfaceContainerHigh, label = \"pixel-free-bg\")",
              "    val content by animateColorAsState(if (selected) cs.onPrimaryContainer else cs.onSurface, label = \"pixel-free-fg\")",
              "    val sub by animateColorAsState(if (selected) cs.onPrimaryContainer.copy(alpha = 0.78f) else cs.onSurfaceVariant, label = \"pixel-free-sub\")",
              "    Surface(",
              "        onClick = onClick,",
              "        interactionSource = source,",
              "        shape = RoundedCornerShape(topStart = 28.dp, topEnd = 28.dp, bottomStart = 8.dp, bottomEnd = 8.dp),",
              "        color = container,",
              "        modifier = modifier.fillMaxWidth(),",
              "    ) {",
              "        Row(",
              "            Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 11.dp),",
              "            verticalAlignment = Alignment.CenterVertically,",
              "        ) {",
              "            Box(Modifier.size(42.dp), contentAlignment = Alignment.Center) {",
              "                Box(",
              "                    Modifier",
              "                        .matchParentSize()",
              "                        .graphicsLayer { rotationZ = turn }",
              "                        .clip(MaterialShapes.Cookie9Sided.toShape())",
              "                        .background(if (selected) cs.primary else cs.secondaryContainer),",
              "                )",
              "                Icon(",
              "                    painterResource(Res.drawable.ic_bolt),",
              "                    contentDescription = null,",
              "                    tint = if (selected) cs.onPrimary else cs.onSecondaryContainer,",
              "                    modifier = Modifier.size(22.dp),",
              "                )",
              "            }",
              "            Spacer(Modifier.width(14.dp))",
              "            Column(Modifier.weight(1f)) {",
              "                Text(",
              "                    text = \"کانفیگ رایگان هوشمند\",",
              "                    style = MaterialTheme.typography.titleMediumEmphasized,",
              "                    color = content,",
              "                    maxLines = 1,",
              "                    overflow = TextOverflow.Ellipsis,",
              "                )",
              "                Text(",
              "                    text = if (selected) (detail ?: \"فعال • دکمه اتصال بالا را بزنید\") else \"ضربه بزنید تا فعال شود (تست و اتصال خودکار)\",",
              "                    style = MaterialTheme.typography.bodySmall,",
              "                    color = sub,",
              "                    maxLines = 1,",
              "                    overflow = TextOverflow.Ellipsis,",
              "                )",
              "            }",
              "            Spacer(Modifier.width(8.dp))",
              "            Box(",
              "                Modifier.size(32.dp).clip(CircleShape).background(if (selected) cs.primary else cs.onSurface.copy(alpha = 0.08f)),",
              "                contentAlignment = Alignment.Center,",
              "            ) {",
              "                Icon(",
              "                    painterResource(if (selected) Res.drawable.ic_check else Res.drawable.ic_bolt),",
              "                    contentDescription = null,",
              "                    tint = if (selected) cs.onPrimary else cs.onSurfaceVariant,",
              "                    modifier = Modifier.size(18.dp),",
              "                )",
              "            }",
              "        }",
              "    }",
              "}",
          ])
          t_px = t_px + "\n" + px_composable
          write(p_px, t_px)

          # 5b) PortalHome.kt: add PortalFreeTicket right above PortalTicket
          p_ph = KT + "/home/PortalHome.kt"
          t_ph = read(p_ph)
          old_ph_sig = "    onBrowseConfigs: () -> Unit,"
          new_ph_sig = "    onBrowseConfigs: () -> Unit,\n    freeActive: Boolean = false,\n    onSelectFree: () -> Unit = {},"
          if old_ph_sig not in t_ph:
              fail("onBrowseConfigs sig not found in PortalHome.kt")
          t_ph = t_ph.replace(old_ph_sig, new_ph_sig, 1)

          old_ph_ticket = "\n".join([
              "                PortalTicket(",
              "                    name = activeConfigName,",
              "                    detail = activeConfigDetail,",
              "                    locked = activeLocked,",
              "                    onClick = onBrowseConfigs,",
              "                    modifier = Modifier.padding(horizontal = 20.dp).tourTarget(TourTargets.CONFIG_CARD),",
              "                )",
          ])
          new_ph_ticket = "\n".join([
              "                PortalFreeTicket(",
              "                    selected = freeActive,",
              "                    detail = if (freeActive) activeConfigName else null,",
              "                    onClick = onSelectFree,",
              "                    modifier = Modifier.padding(horizontal = 20.dp).tourTarget(\"free-row\"),",
              "                )",
              "                Spacer(Modifier.height(6.dp))",
              "                PortalTicket(",
              "                    name = if (freeActive) null else activeConfigName,",
              "                    detail = if (freeActive) null else activeConfigDetail,",
              "                    locked = false,",
              "                    onClick = onBrowseConfigs,",
              "                    modifier = Modifier.padding(horizontal = 20.dp).tourTarget(TourTargets.CONFIG_CARD),",
              "                )",
          ])
          if old_ph_ticket not in t_ph:
              fail("PortalTicket call not found in PortalHome.kt")
          t_ph = t_ph.replace(old_ph_ticket, new_ph_ticket, 1)

          ph_composable = "\n".join([
              "",
              "@Composable",
              "private fun PortalFreeTicket(",
              "    selected: Boolean,",
              "    detail: String?,",
              "    onClick: () -> Unit,",
